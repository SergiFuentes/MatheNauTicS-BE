spring:
  application:
    name: MatheNauTicS-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

# Development CORS origins (comma-separated).
# Overridden in application-prod.yml via CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://192.168.1.49:5500,http://192.168.0.16:5500,http://localhost:3000,http://127.0.0.1:3000,http://172.21.224.1:5500,http://192.168.61.55:5500