spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000

logging:
  level:
    root: WARN
    com.mathenautics: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.flywaydb: INFO

cors:
  # Keep the primary production origin environment-configured. Also allow the
  # Capacitor Android WebView origin and this project's Pages preview subdomains.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-origin-patterns: https://localhost,https://*.mathenautics.pages.dev