# Test-only configuration. Overrides properties that require env vars
# (which CI and local test runs intentionally don't provide).
jwt:
  secret: test-secret-for-integration-tests-only-at-least-32-bytes-long

# Exercise the production Cloudflare Pages preview-origin pattern in tests.
cors:
  allowed-origins: https://mathenautics.pages.dev
  allowed-origin-patterns: https://*.mathenautics.pages.dev
